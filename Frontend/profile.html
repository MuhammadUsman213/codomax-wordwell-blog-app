<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Profile — WordWell</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <a href="index.html" class="brand"><span class="brand-mark">¶</span>WordWell</a>
  <nav class="nav-links">
    <a href="index.html">Home</a>
    <a href="dashboard.html">Dashboard</a>
    <span data-auth-slot style="display:flex; gap:1.8rem; align-items:center;"></span>
  </nav>
</header>

<main>
  <div class="auth-shell" style="min-height:auto; padding-top:3rem;">
    <div class="auth-card">
      <span class="eyebrow">Your account</span>
      <h1>Profile</h1>
      <p class="sub" id="profile-email"></p>

      <div class="form-error" id="error-box"></div>
      <div class="form-error" id="success-box" style="background:#EAF3E7; border-color: var(--sage); color:#3F5B34;"></div>

      <form id="profile-form" novalidate>
        <div class="field">
          <label for="name">Display name</label>
          <input type="text" id="name" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Save changes</button>
      </form>

      <div class="dash-stats" style="margin-top:2rem; margin-bottom:0;">
        <div class="stat-pill">
          <span class="num" id="stat-total">0</span>
          <span class="label">Posts written</span>
        </div>
      </div>

      <button id="logout-btn" class="btn btn-ghost btn-block" style="margin-top:1.5rem;">Log out</button>
    </div>
  </div>
</main>

<footer class="site-footer">
  <span>WordWell — built for the Codomax internship, Module 5</span>
  <span>Authentication &amp; Dashboard · Day 17–20</span>
</footer>

<script src="js/app.js"></script>
<script>
  const session = requireAuth();

  if (session) {
    document.getElementById("profile-email").textContent = session.email;
    document.getElementById("name").value = session.name;
    document.getElementById("stat-total").textContent = getPostsByAuthor(session.name).length;

    document.getElementById("profile-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const errorBox = document.getElementById("error-box");
      const successBox = document.getElementById("success-box");
      errorBox.classList.remove("show");
      successBox.classList.remove("show");

      const name = document.getElementById("name").value.trim();
      if (!name) {
        errorBox.textContent = "Display name can't be empty.";
        errorBox.classList.add("show");
        return;
      }

      try {
        updateUserProfile({ name });
        successBox.textContent = "Profile updated.";
        successBox.classList.add("show");
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.add("show");
      }
    });

    document.getElementById("logout-btn").addEventListener("click", logout);
  }
</script>
</body>
</html>
