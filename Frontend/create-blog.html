<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Write — WordWell</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <a href="index.html" class="brand"><span class="brand-mark">¶</span>WordWell</a>
  <nav class="nav-links">
    <a href="index.html">Home</a>
    <a href="dashboard.html">Dashboard</a>
    <span data-auth-slot style="display:flex; gap:1.8rem; align-items:center;"></span>
  </nav>
</header>

<main>
  <div class="editor-shell">
    <span class="eyebrow">New entry</span>
    <h1>Write something</h1>
    <div class="editor-meta">
      <span id="editor-author"></span>
      <span id="editor-date"></span>
    </div>

    <div class="form-error" id="error-box"></div>

    <form id="post-form" novalidate>
      <div class="field">
        <label for="title">Title</label>
        <input type="text" id="title" required placeholder="Give it a name" />
      </div>
      <div class="field">
        <label for="category">Category</label>
        <select id="category" class="filter-bar" style="width:100%; padding:0.7rem 0.85rem; border:1px solid var(--line); border-radius:var(--radius); background:#fff; font-family:var(--font-body); font-size:0.96rem;"></select>
      </div>
      <div class="field">
        <label for="body">Body</label>
        <textarea id="body" required placeholder="Start writing..."></textarea>
      </div>
      <div style="display:flex; gap:1rem;">
        <button type="submit" class="btn btn-primary">Publish</button>
        <a href="dashboard.html" class="btn btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
</main>

<footer class="site-footer">
  <span>WordWell — built for the Codomax internship, Module 1</span>
  <span>Frontend Development · Day 1–4</span>
</footer>

<script src="js/app.js"></script>
<script>
  const session = requireAuth();

  if (session) {
    document.getElementById("editor-author").textContent = "by " + session.name;
    document.getElementById("editor-date").textContent = formatDate(new Date().toISOString());

    const categorySelect = document.getElementById("category");
    categorySelect.innerHTML = CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join("");

    document.getElementById("post-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const title = document.getElementById("title").value.trim();
      const body = document.getElementById("body").value.trim();
      const category = categorySelect.value;
      const errorBox = document.getElementById("error-box");

      if (!title || !body) {
        errorBox.textContent = "Both a title and some body text are needed before publishing.";
        errorBox.classList.add("show");
        return;
      }

      createPost({ title, body, author: session.name, category });
      window.location.href = "dashboard.html";
    });
  }
</script>
</body>
</html>
