<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — WordWell</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <a href="index.html" class="brand"><span class="brand-mark">¶</span>WordWell</a>
  <nav class="nav-links">
    <a href="index.html">Home</a>
    <span data-auth-slot style="display:flex; gap:1.8rem; align-items:center;"></span>
  </nav>
</header>

<main>
  <div class="auth-shell">
    <div class="auth-card">
      <span class="eyebrow">Welcome back</span>
      <h1>Log in</h1>
      <p class="sub">Pick up where you left off.</p>

      <div class="form-error" id="error-box"></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Log in</button>
      </form>

      <p class="auth-switch">New to WordWell? <a href="register.html">Create an account</a></p>
    </div>
  </div>
</main>

<footer class="site-footer">
  <span>WordWell — built for the Codomax internship, Module 1</span>
  <span>Frontend Development · Day 1–4</span>
</footer>

<script src="js/app.js"></script>
<script>
  document.getElementById("login-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const errorBox = document.getElementById("error-box");
    errorBox.classList.remove("show");

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
      loginUser({ email, password });
      window.location.href = "dashboard.html";
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add("show");
    }
  });
</script>
</body>
</html>
