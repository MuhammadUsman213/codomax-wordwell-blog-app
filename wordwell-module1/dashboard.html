<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — WordWell</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <a href="index.html" class="brand"><span class="brand-mark">¶</span>WordWell</a>
  <nav class="nav-links">
    <a href="index.html">Home</a>
    <a href="dashboard.html" class="active">Dashboard</a>
    <span data-auth-slot style="display:flex; gap:1.8rem; align-items:center;"></span>
  </nav>
</header>

<main>
  <div class="dash-header">
    <div>
      <span class="eyebrow" id="welcome-line">Your desk</span>
      <h1 style="margin:0;">Dashboard</h1>
    </div>
    <a href="create-blog.html" class="btn btn-gold">+ New post</a>
  </div>

  <div class="dash-stats">
    <div class="stat-pill">
      <span class="num" id="stat-total">0</span>
      <span class="label">Posts written</span>
    </div>
    <div class="stat-pill">
      <span class="num" id="stat-latest">—</span>
      <span class="label">Last published</span>
    </div>
  </div>

  <div class="section-heading">
    <h2 style="font-size:1.2rem; margin:0;">Your posts</h2>
  </div>

  <div id="post-list"></div>
</main>

<footer class="site-footer">
  <span>WordWell — built for the Codomax internship, Module 1</span>
  <span>Frontend Development · Day 1–4</span>
</footer>

<script src="js/app.js"></script>
<script>
  const session = requireAuth();

  if (session) {
    document.getElementById("welcome-line").textContent = "Signed in as " + session.name;

    function render() {
      const myPosts = getPostsByAuthor(session.name);
      document.getElementById("stat-total").textContent = myPosts.length;
      document.getElementById("stat-latest").textContent = myPosts.length ? formatDate(myPosts[0].date) : "—";

      const list = document.getElementById("post-list");
      if (myPosts.length === 0) {
        list.innerHTML = `<div class="empty-state"><h3>No posts yet</h3><p>Your dashboard is ready whenever you are.</p></div>`;
        return;
      }
      list.innerHTML = myPosts.map(p => `
        <div class="dash-post-row">
          <div>
            <div class="title">${p.title}</div>
            <div class="meta">${formatDate(p.date)}</div>
          </div>
          <div class="row-actions">
            <button class="icon-btn danger" data-delete="${p.id}">Delete</button>
          </div>
        </div>
      `).join("");

      list.querySelectorAll("[data-delete]").forEach(btn => {
        btn.addEventListener("click", () => {
          if (confirm("Delete this post?")) {
            deletePost(btn.dataset.delete);
            render();
          }
        });
      });
    }
    render();
  }
</script>
</body>
</html>
