<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Post — WordWell</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<style>
  .post-shell { max-width: 680px; margin: 3rem auto; }
  .post-shell .post-body { font-size: 1.08rem; line-height: 1.85; color: var(--ink); white-space: pre-wrap; margin-top: 2rem; }
  .post-shell .post-meta { display: flex; gap: 1.2rem; align-items: center; margin: 1rem 0 0; }
  .back-link { font-family: var(--font-mono); font-size: 0.8rem; color: var(--sage); text-decoration: none; }
  .back-link:hover { color: var(--ink); }
</style>
</head>
<body>

<header class="site-header">
  <a href="index.html" class="brand"><span class="brand-mark">¶</span>WordWell</a>
  <nav class="nav-links">
    <a href="index.html">Home</a>
    <span data-auth-slot style="display:flex; gap:1.8rem; align-items:center;"></span>
  </nav>
</header>

<main>
  <div class="post-shell">
    <a href="index.html" class="back-link">&larr; Back to all posts</a>

    <div id="post-content">
      <p style="margin-top:2rem; color:var(--sage);">Loading…</p>
    </div>
  </div>
</main>

<footer class="site-footer">
  <span>WordWell — built for the Codomax internship, Module 3</span>
  <span>Database Integration · Day 9–12</span>
</footer>

<script src="js/app.js"></script>
<script>
  // Reads ?id=<mongoId> from the URL and fetches that one post's detail.
  // Falls back to localStorage lookup if the backend isn't wired up yet.
  const params = new URLSearchParams(window.location.search);
  const postId = params.get("id");
  const contentBox = document.getElementById("post-content");

  async function loadPost() {
    if (!postId) {
      contentBox.innerHTML = `<div class="empty-state"><h3>No post selected</h3><p>Go back and pick a post to read.</p></div>`;
      return;
    }

    try {
      // TODO(Module 2/3 backend): this is the real call once the API is live
      const res = await fetch(`http://localhost:5000/api/blogs/${postId}`);
      if (!res.ok) throw new Error("not found on server");
      const post = await res.json();
      renderPost({
        title: post.title,
        body: post.body,
        author: post.author?.name || "Unknown",
        date: post.createdAt,
      });
    } catch (err) {
      // fallback: look it up in the local demo data so the page still works
      // before the backend is connected
      const local = getAllPosts().find((p) => p.id === postId);
      if (local) {
        renderPost(local);
      } else {
        contentBox.innerHTML = `<div class="empty-state"><h3>Post not found</h3><p>It may have been deleted, or the backend isn't running yet.</p></div>`;
      }
    }
  }

  function renderPost(p) {
    contentBox.innerHTML = `
      <span class="eyebrow">Entry</span>
      <h1>${p.title}</h1>
      <div class="post-meta">
        <span class="post-date">${formatDate(p.date)}</span>
        <span class="post-author">— ${p.author}</span>
      </div>
      <div class="post-body">${p.body}</div>
    `;
  }

  loadPost();
</script>
</body>
</html>
